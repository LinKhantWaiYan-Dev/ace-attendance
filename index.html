<style>
:root{
  --paper:#FFFFFF; --wash:#F4F6FA; --line:#E1E6EF; --line-2:#CDD5E3;
  --ink:#152238; --ink-2:#56627A; --ink-3:#8590A6;
  --navy:#1E3A6D; --navy-2:#2C5296; --navy-wash:#EEF2FA; --red:#B4232C;
  --ok:#1B7A4D; --ok-bg:#E7F5EE; --late:#965800; --late-bg:#FFF2DC;
  --bad:#B4232C; --bad-bg:#FCEBEC; --pend:#2C5296; --pend-bg:#EAF0FB;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--navy-2)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:700}
:focus-visible{outline:3px solid var(--navy-2);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--navy) 0 82%,var(--red) 82% 100%)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.mark{width:40px;height:40px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.04em;flex:none;position:relative}
.mark::after{content:"";position:absolute;left:8px;right:8px;bottom:7px;height:2px;background:var(--red)}
.school{min-width:0;flex:1}
.school b{display:block;font-family:var(--f-display);font-size:1rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.school span{font-size:.8rem;color:var(--ink-2)}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--navy-wash);color:var(--navy)}
.sync{font-size:.75rem;color:var(--ink-3)}
.sync.off{color:var(--bad);font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 10px;border-bottom:3px solid transparent;color:var(--ink-2);font-weight:700;white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab[aria-current="page"]{color:var(--navy);border-bottom-color:var(--navy)}
/* phone menu (v1.4.2): tap ☰ Menu instead of scrolling the tabs sideways */
.menu-btn{display:none;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--navy);font-weight:700;border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer;flex:none;position:relative;font-size:.95rem}
.menu-btn svg{width:20px;height:20px}
.menu-btn .count{position:absolute;top:-7px;right:-7px}
.drawer{position:fixed;inset:0;z-index:60}
.drawer .scrim{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.drawer-in{position:absolute;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--paper);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-in.anim{animation:slideIn .18s ease-out}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-h .who-d{flex:1;min-width:0}
.drawer-h .who-d b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-x{border:0;background:var(--wash);border-radius:10px;width:44px;height:44px;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--ink)}
.drawer-nav{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain}
.d-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:12px 14px;min-height:56px;cursor:pointer;color:var(--ink)}
.d-item b{display:block;font-size:1rem}
.d-item small{display:block;color:var(--ink-2);font-size:.8rem;margin-top:1px}
.d-item .d-t{flex:1;min-width:0}
.d-item[aria-current="page"]{background:var(--navy-wash)}
.d-item[aria-current="page"] b{color:var(--navy)}
.d-item:active{background:var(--wash)}
.drawer-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.drawer-f .btn{min-height:46px}
body.noscroll{overflow:hidden}
.ex-opt{display:flex;flex-direction:row;align-items:flex-start;gap:12px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.ex-opt input{margin-top:4px;width:20px;height:20px;flex:none}
.ex-opt>span{flex:1;min-width:0}
/* tablets etc.: if the tabs don't fit the width, use the Menu button instead of sideways scrolling */
.top.use-menu .menu-btn{display:inline-flex}
.top.use-menu .tabs,.top.use-menu .who{display:none}
@media (max-width:760px){
  .menu-btn{display:inline-flex}
  .top .tabs,.top .who{display:none}
  .top-in{flex-wrap:nowrap}
  .mark{width:36px;height:36px}
  .school b{font-size:.92rem}
  .school span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:.72rem;display:inline-grid;place-items:center}
main{padding-block:22px 60px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:18px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1px solid var(--line-2);background:var(--paper);border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:#EBC3C6}
.btn.danger:hover{background:var(--bad-bg)}
.btn.solid-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{min-height:34px;padding:5px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.input{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:var(--paper);min-height:44px}
.input:focus{border-color:var(--navy-2);outline:none;box-shadow:0 0 0 3px var(--navy-wash)}
.input[readonly]{background:var(--wash);color:var(--ink-2)}
textarea.input{min-height:76px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hint{font-size:.82rem;color:var(--ink-2)}
.err{color:var(--bad);font-size:.88rem;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-present,.c-approved{background:var(--ok-bg);color:var(--ok)} .c-late{background:var(--late-bg);color:var(--late)}
.c-absent,.c-declined{background:var(--bad-bg);color:var(--bad)} .c-excused{background:#EEE8F7;color:#5B3FA0} .c-accepted{background:var(--ok-bg);color:var(--ok)} .c-rejected{background:var(--bad-bg);color:var(--bad)} .c-pending{background:var(--pend-bg);color:var(--pend)}
.login{min-height:calc(100vh - 80px);display:grid;place-items:center;padding-block:28px}
.login-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.bigclock{font-family:var(--f-mono);font-size:2.4rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.tl{position:relative;height:46px;margin-top:22px}
.tl-tick.up span{top:auto;bottom:26px}
.tl-bar{position:absolute;left:0;right:0;top:10px;height:12px;border-radius:99px;overflow:hidden;display:flex;background:var(--wash)}
.tl-bar i{display:block;height:100%}
.tl-early{background:#DCE4F2} .tl-present{background:#BFE3CF} .tl-late{background:#F6DDB0} .tl-closed{background:#F3C7CB}
.tl-tick{position:absolute;top:4px;width:2px;height:24px;background:var(--ink);transform:translateX(-1px)}
.tl-tick span{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:.72rem;white-space:nowrap;color:var(--ink-2)}
.tl-now{position:absolute;top:0;width:14px;height:14px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 0 0 1px var(--red);transform:translateX(-7px);transition:left .6s}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:4px}
.tl-legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.predict{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:8px;background:var(--wash)}
.done{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--wash)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--ink-2);font-weight:700}
.s-pending b{color:var(--pend)} .s-present b{color:var(--ok)} .s-late b{color:var(--late)} .s-declined b{color:var(--bad)}
.pend-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:420px){.pend-list{grid-template-columns:minmax(0,1fr)}}
.pend{border:1px solid var(--line);border-left:4px solid var(--pend);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pend-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.note{font-size:.9rem;background:var(--wash);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:7px 14px;font-weight:700;font-size:.9rem;color:var(--ink-2)}
.seg label+label span{border-left:1px solid var(--line-2)}
.seg input:checked+span.m-present{background:var(--ok-bg);color:var(--ok)}
.seg input:checked+span.m-late{background:var(--late-bg);color:var(--late)}
.seg input:focus-visible+span{outline:3px solid var(--navy-2);outline-offset:-3px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rec{display:grid;grid-template-columns:120px minmax(0,1fr) 92px 92px 104px 84px;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec.head{background:var(--wash);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-2);padding-block:8px}
.rec .who b,.rec .who span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .who span{font-size:.84rem;color:var(--ink-2)}
.rec .act{text-align:right}
.rec .k{display:none}
@media (max-width:820px){
  .rec.head{display:none}
  .rec{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who act" "date time" "mark status";row-gap:6px}
  .rec .who{grid-area:who}.rec .act{grid-area:act}.rec .c-d{grid-area:date}.rec .c-t{grid-area:time;text-align:right}
  .rec .c-m{grid-area:mark}.rec .c-s{grid-area:status;text-align:right}
  .rec .k{display:inline;color:var(--ink-3);font-size:.78rem;margin-right:4px}
}
.srow{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,68px);gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow.head{background:var(--wash);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--ink-2);padding-block:8px}
.srow .who b,.srow .who span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .who span{font-size:.84rem;color:var(--ink-2)}
@media (max-width:480px){.srow{grid-template-columns:minmax(0,1fr) repeat(4,48px);gap:4px;padding-inline:10px}}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:1.05rem}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li>div{min-width:0}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--wash);color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.tag.off{background:var(--bad-bg);color:var(--bad)}
.switch{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--navy);flex:none;margin-top:2px}
.hist{display:flex;flex-direction:column;gap:8px;font-size:.88rem;max-height:220px;overflow:auto;padding-right:4px}
.hist div{border-left:2px solid var(--line-2);padding-left:10px}
.copyrow{display:flex;gap:8px;align-items:center}
.copyrow input{flex:1;min-width:0}
#modal{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(21,34,56,.42)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--paper);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(21,34,56,.25)}
@media (max-width:560px){.sheet{top:auto;bottom:0;transform:translateX(-50%);width:100%;border-radius:16px 16px 0 0;max-height:92%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 24px));pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-weight:700;font-size:.92rem;pointer-events:auto;border-left:5px solid var(--navy-2)}
.toast.ok{border-left-color:#3FBF85}.toast.bad{border-left-color:#FF6B73}.toast.new{border-left-color:#F2B24C}
.foot .copy{color:var(--ink-2)}
.foot{border-top:1px solid var(--line);padding-block:14px;font-size:.8rem;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
textarea.csv{font-family:var(--f-mono);font-size:12px;min-height:200px;white-space:pre;overflow:auto}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* connection + live indicator */
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:#2FA36B;flex:none}
.dot.demo{background:#C98A1B} .dot.off{background:var(--red)}
.conn{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:8px;background:var(--wash)}
.conn.ok{border-color:#9DD3B6} .conn.bad{border-color:#EBC3C6} .conn.demo{border-color:#EED29A}
.conn-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px}
@media (max-width:620px){.conn-row{grid-template-columns:minmax(0,1fr)}}
.srow.stu{grid-template-columns:36px minmax(0,1fr) 110px 110px auto}
.srow.stu .who{display:flex;flex-wrap:wrap;column-gap:10px;align-items:baseline}
.srow.stu .who b{white-space:normal;overflow:visible}
@media (max-width:700px){.srow.stu{grid-template-columns:28px minmax(0,1fr) auto;row-gap:6px}.srow.stu>:nth-child(4){display:none}.srow.stu>:nth-child(5){grid-column:2/-1;justify-content:flex-start!important}.srow.stu.head>:nth-child(5){display:none}}
/* alerts + MC */
.alertbox{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r);border:1px solid #EED29A;background:var(--late-bg);color:#5d3a00}
.alertbox.lvl2,.alertbox.lvl3{border-color:#EBC3C6;background:var(--bad-bg);color:#7a1820}
.alertbox.lvl3 b{font-size:1.05rem}
.filepick{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line-2);border-radius:var(--r);padding:14px;cursor:pointer;color:var(--navy-2);font-weight:700;position:relative}
.filepick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filepick:focus-within{outline:3px solid var(--navy-2);outline-offset:2px}
.lv-prev{max-height:180px;width:auto;border-radius:8px;border:1px solid var(--line);margin-top:8px}
.mc-img{width:100%;max-height:60vh;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--wash)}

/* ---------- SHA-256 (pure JS, for demo-mode passwords) ---------- */
function sha256(str){
  const s=unescape(encodeURIComponent(str)), rr=(v,a)=>(v>>>a)|(v<<(32-a)), K=[], H=[]; let p=0;
  for (let c=2;p<64;c++){ let pr=true; for (let i=2;i*i<=c;i++) if (c%i===0){pr=false;break;} if (pr){ if (p<8) H[p]=(Math.pow(c,1/2)*4294967296)|0; K[p++]=(Math.pow(c,1/3)*4294967296)|0; } }
  const b=[]; for (let i=0;i<s.length;i++) b.push(s.charCodeAt(i));
  const bl=b.length*8; b.push(0x80); while (b.length%64!==56) b.push(0);
  const hi=Math.floor(bl/4294967296), lo=bl>>>0;
  b.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,(lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
  const h=H.slice();
  for (let j=0;j<b.length;j+=64){
    const w=new Array(64);
    for (let i=0;i<16;i++) w[i]=(b[j+i*4]<<24)|(b[j+i*4+1]<<16)|(b[j+i*4+2]<<8)|b[j+i*4+3];
    for (let i=16;i<64;i++){ const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3), s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let [a,bb,c,d,e,f,g,hh]=h;
    for (let i=0;i<64;i++){ const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0, t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))|0; hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=bb; bb=a; a=(t1+t2)|0; }
    h[0]=(h[0]+a)|0; h[1]=(h[1]+bb)|0; h[2]=(h[2]+c)|0; h[3]=(h[3]+d)|0; h[4]=(h[4]+e)|0; h[5]=(h[5]+f)|0; h[6]=(h[6]+g)|0; h[7]=(h[7]+hh)|0;
  }

}
function rid(n=16){ try { const a=new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,"0")).join(""); } catch(e){ let s=""; while (s.length<n*2) s+=Math.random().toString(16).slice(2); return s.slice(0,n*2); } }

/* ---------- Singapore time ---------- */
const partsFmt = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function sgt(d=new Date()){
  const o={}; for (const x of partsFmt.formatToParts(d)) o[x.type]=x.value;
  const hh=o.hour==="24"?"00":o.hour;
  return {date:`${o.year}-${o.month}-${o.day}`, month:`${o.year}-${o.month}`, time:`${hh}:${o.minute}:${o.second}`, h:+hh, m:+o.minute, s:+o.second};
}
const toSecs = t => { const [h,m,s]=String(t||"0:0:0").split(":").map(Number); return (h||0)*3600+(m||0)*60+(s||0); };
function fmt12(t, sec=false){ if (!t) return "—"; const [H,M,X]=String(t).split(":").map(Number); return `${((H+11)%12)+1}:${String(M||0).padStart(2,"0")}${sec?":"+String(X||0).padStart(2,"0"):""} ${H>=12?"PM":"AM"}`; }
function dateLabel(d, opts={weekday:"short",day:"numeric",month:"short",year:"numeric"}){ if (!d) return "—"; const [y,m,dd]=d.split("-").map(Number); return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString("en-GB",{...opts,timeZone:"UTC"}); }
function monthLabel(mo){ if (!mo) return "—"; const [y,m]=mo.split("-").map(Number); return new Date(Date.UTC(y,m-1,1)).toLocaleDateString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"}); }
function stampLabel(s){ if (!s) return "—"; const [d,t]=String(s).split(" "); return `${dateLabel(d,{day:"numeric",month:"short"})}, ${fmt12(t)}`; }
const nowStamp = () => { const t=sgt(); return t.date+" "+t.time; };

const closeAt = () => dayInfoC(sgt().date).close;

/* =========================================================================

const inAppsScript = () => !!(window.google && google.script && google.script.run);

  if (CONFIG.SHEET_URL) return {url:CONFIG.SHEET_URL.trim(), key:(CONFIG.SHEET_KEY||"").trim(), fromConfig:true};
  const url=store.get("sheetUrl"); return url ? {url, key:store.get("sheetKey")||"", fromConfig:false} : null;
}

function callScript(action, args){
  return new Promise((resolve, reject)=>{
    const t=setTimeout(()=>reject(new Error("The server is taking too long to answer. If you just updated the app, wait a minute and reload. Otherwise open Apps Script > Executions to see the error.")), 90000);
    google.script.run
      .withSuccessHandler(v=>{ clearTimeout(t); if (v===null || v===undefined) reject(new Error("The server sent back nothing. Open Apps Script > Executions to see the error, or run setup again.")); else resolve(v); })

/* ---------- timetable (same rules as Code.gs) ---------- */
const DEFAULT_TT = {start:"", end:"", days:[1,2,3,4,5], overrides:{}, blocks:[]};
const ttNow = () => (S.settings && S.settings.timetable) || DEFAULT_TT;
const weekdayOf = date => { const wd=new Date(date+"T12:00:00Z").getUTCDay(); return wd===0?7:wd; };
/** The module period that covers this date (inside its dates, on one of its weekdays). */
function blockForC(date, tt){ tt=tt||ttNow(); const wd=weekdayOf(date); return (tt.blocks||[]).find(b=>date>=b.startDate && date<=b.endDate && (b.days||[]).includes(wd)) || null; }
/* Safety rules (same as Code.gs): a day with records always counts; a past day without records never does;
   only today and the future follow the timetable plan. So the timetable can never hide recorded days. */
function isClassDayC(date, tt){
  tt = tt || ttNow();
  if (tt.recDates && tt.recDates[date]) return true;
  if (date < (tt.today || sgt().date)) return false;
  return planClassDayC(date, tt);
}
const firstBlockC = tt => (tt.blocks||[]).reduce((m,b)=>!m||b.startDate<m?b.startDate:m, "");
function planClassDayC(date, tt){
  tt = tt || ttNow();
  if (tt.start && date < tt.start) return false;
  if (tt.end && date > tt.end) return false;
  if (tt.overrides && tt.overrides[date]==="off") return false;
  if (tt.overrides && tt.overrides[date]==="on") return true;
  const first = firstBlockC(tt);
  if (first && date >= first) return !!blockForC(date, tt);
  return (tt.days||[]).includes(weekdayOf(date));
}
/** Modules taught in a month: timetable entries, plus modules found in that month's records (for months before the timetable). */
function monthModules(month, tt){
  tt = tt || ttNow();
  const out = (tt.blocks||[]).filter(b=>b.startDate.slice(0,7)<=month && b.endDate.slice(0,7)>=month).sort((a,b)=>a.startDate.localeCompare(b.startDate))
    .map(b=>({name:b.moduleName, code:modCode(b.moduleId,b.moduleName), from:b.startDate, to:b.endDate, days:b.days, time:timeRange(b.classStart,b.classEnd), lecturer:b.lecturerName||""}));
  const seen = new Set(out.map(x=>x.name.toLowerCase()));
  const recs = ((typeof S!=="undefined"&&S.records)||[]).filter(r=>r.month===month || String(r.date||"").slice(0,7)===month);
  const byMod = {};
  recs.forEach(r=>{ const n=r.moduleName||""; if (!n || seen.has(n.toLowerCase())) return; const k=n.toLowerCase(); const x=byMod[k]||(byMod[k]={name:n, code:modCode(r.moduleId,n), from:r.date, to:r.date, fromRecords:true}); if (r.date<x.from) x.from=r.date; if (r.date>x.to) x.to=r.date; });
  return out.concat(Object.values(byMod));
}
function monthModulesCard(month){
  const mm = monthModules(month);
  const fmtD = d => dateLabel(d,{day:"numeric",month:"short"});
  return `<section class="panel stack"><div class="label">What we teach</div><h2>Modules in ${esc(monthLabel(month))}</h2>
    ${mm.length?`<div class="list">${mm.map(x=>`<div class="li"><div><b>${esc(x.name)}</b> <span class="tag">${esc(x.code)}</span>
      <div class="muted" style="font-size:.86rem">${x.fromRecords?`Since ${fmtD(x.from)}`:`${fmtD(x.from)} – ${fmtD(x.to)}`}${x.days?` · ${esc(daysLabel(x.days))}`:""}${x.time?` · ${esc(x.time)}`:""}${x.lecturer?` · ${esc(x.lecturer)}`:""}${x.fromRecords?" · no module dates set for this month":""}</div></div></div>`).join("")}</div>`
    :`<div class="empty"><b>No module this month</b><span>The admin adds modules in Calendar → Module timetable.</span></div>`}</section>`;
}
const hmMin = t => { const [h,m]=String(t||"0:0").split(":").map(Number); return (h||0)*60+(m||0); };

/** Module, class time and attendance window for a date. The window keeps the same distance from class start as Settings. */
function dayInfoFor(st, tt, date){
  st=st||{}; const b=blockForC(date, tt), base=hmMin(st.classStart||"09:00"), cs=b?b.classStart:(st.classStart||"09:00");
  const sh=(t,def)=>minHm(hmMin(cs)+hmMin(t||def)-base);
  return {block:b, moduleId:b?b.moduleId:"", moduleName:b?b.moduleName:"", lecturerName:b?(b.lecturerName||""):"", classStart:cs, classEnd:b?b.classEnd:(st.classEnd||"12:00"),
    open:sh(st.openAt,"08:30"), until:sh(st.presentUntil,"09:20"), close:sh(st.closeAt,"09:30")};
}
const dayInfoC = date => { const i=dayInfoFor(S.settings||{}, ttNow(), date); if (!i.moduleName){ const m=defaultModule(); if (m){ i.moduleId=m.id; i.moduleName=m.name; i.lecturerName=m.lecturerName||""; } } return i; };
/** Days not covered by module dates use the active module (same as the server). */

function modCode(id, name){ const m=(typeof S!=="undefined"&&S.modules||[]).find(x=>x.id===id); if (m&&m.code) return m.code; return String(name||"").split(/[^A-Za-z0-9]+/).filter(w=>w&&!/^(and|of|the|for|in|to)$/i.test(w)).map(w=>w[0]).join("").toUpperCase().slice(0,6); }

/* shared by demo export (server builds its own) */
function filterRecords(list, f){
  f=f||{}; const q=String(f.q||"").trim().toLowerCase();
  return list.filter(r=>(!f.month||r.month===f.month)&&(!f.module||r.moduleId===f.module)&&
    (!f.status||(["Present","Late","Absent","Excused"].includes(f.status)?(r.status==="Approved"&&r.mark===f.status):r.status===f.status))&&
    (!q||`${r.studentName} ${r.studentKey} ${r.studentNote} ${r.lecturerNote}`.toLowerCase().includes(q)));
}
function buildCsv(rows){
  const cols=[["Record ID","id"],["Date","date"],["Day","day"],["Month","month"],["Student Key","studentKey"],["Student Name","studentName"],["Student ID","studentId"],["Module Name","moduleName"],
    ["Submitted Time","submittedTime"],["Auto Mark","autoMark"],["Final Mark","mark"],["Status","status"],["Reviewed By","reviewedBy"],["Reviewed At","reviewedAt"],["Student Note","studentNote"],["Lecturer Note","lecturerNote"],["Source","source"]];
  const q=v=>{ let s=String(v??""); if (/^[=+\-@]/.test(s)) s="'"+s; return /[",\r\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  return "﻿"+[cols.map(c=>q(c[0])).join(","), ...rows.map(r=>cols.map(c=>q(c[1]==="mark"&&r.status==="Declined"?"":r[c[1]])).join(","))].join("\r\n");
}

  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) refresh(false); });

    catch(e){ if (!S.me) S.loginErr = "Couldn't load your data: " + (e.message==="timeout" ? "the server is taking too long. Try again in a minute." : e.message); }

async function refresh(force){

  S.refreshing=true;
  try {
    if (mode()==="demo") Local.reload();
    const d=await api("apiState", S.token, force?null:S.version);
    S.online=true; S.lastSync=new Date();
    if (!d.unchanged) applyState(d);
  } catch(e){
    if (S.token) S.online=false;
    if (S.token && !S.me) S.loginErr="Signed in, but the data couldn't load: "+e.message;
  }
  S.refreshing=false;
  if (S.refreshAgain){ S.refreshAgain=false; return refresh(true); }
  try { if (S.me) render(); else paintLive(); } catch(e){ console.error(e); toast("Display error: "+e.message,"bad"); }

function applyState(d){
  const first=!S.me;

  S.accounts=d.accounts||[]; S.audit=d.audit||[]; S.sheetUrl=d.sheetUrl||""; S.requests=d.requests||[];
  const openReq=new Set(S.requests.filter(r=>r.status==="Open").map(r=>r.id+"|"+r.at));
  if (!first && S.openReqIds && S.me.role!=="Student") S.requests.forEach(r=>{ if (r.status==="Open" && !S.openReqIds.has(r.id+"|"+r.at)) toast(`Password help: ${r.name} (${r.username}) forgot their password`,"new"); });
  S.openReqIds=openReq;
  const mc={}; S.records.forEach(r=>{ mc[r.id]=msgsOf(r).length; });
  if (!first && S.msgCounts) S.records.forEach(r=>{ const m=msgsOf(r), prev=S.msgCounts[r.id]||0; if (m.length>prev){ const last=m[m.length-1]; if (last.by!==S.me.key) toast(S.me.role==="Student"?`New message from ${last.name}`:`Message from ${r.studentName}: “${last.text.slice(0,60)}${last.text.length>60?"…":""}”`,"new"); } });

    else S.leave.forEach(x=>{ if (prevLeave[x.id]==="Pending" && x.status!=="Pending") toast(`Your MC was ${x.status.toLowerCase()}${x.reply?": "+x.reply:""}`,"new"); });
  }
  if (S.me.role==="Student") setTimeout(absenceAlert, 50);
  if (!S.tab || !TABS[S.me.role].some(t=>t[0]===S.tab)) S.tab=TABS[S.me.role][0][0];
  const pend=new Set(S.records.filter(r=>r.status==="Pending").map(r=>r.id));

}

  try {
    const r=await api("apiLogin", u, p);
    if (r.status==="ok"){
      S.loginLock=null; S.calMonth=S.calDay=S.ttMonth=S.calStudent=null; S.token=r.token; store.set(tokenKey(), r.token); S.version=null; S.pendingIds=null; S.openReqIds=null;
      await refresh(true);
      if (!S.me && !S.loginErr) S.loginErr="Signed in, but the data didn't load. Try again.";
    } else if (r.status==="locked"){
      S.loginLock={user:u.trim().toLowerCase(), until:Date.now()+r.wait*1000, left:r.left};
      S.loginErr="";
    } else if (r.status==="blocked"){
      S.loginLock={user:u.trim().toLowerCase(), until:0, blocked:true};
      S.loginErr="";
    } else {
      S.loginLock=null;
      S.loginErr = "Username or password is incorrect." + (r.beforeWait>0 ? ` ${r.beforeWait} more wrong ${r.beforeWait===1?"try":"tries"} and you'll have to wait 1 minute.` : r.left ? ` ${r.left} ${r.left===1?"try":"tries"} left before the account is locked.` : "");
    }
  } catch(e){ S.loginErr=e.message; }
  S.busy=false; render();
}

function dayStats(date){
  const studs=S.accounts.filter(a=>a.role==="Student"&&a.active), today=sgt().date;
  const out={P:[],L:[],A:[],E:[],Q:[],X:[],N:[]};
  studs.forEach(a=>{ const r=S.records.find(x=>x.date===date&&x.studentKey===a.key);
    if (!r){ if (date<today) out.N.push({a}); else if (date===today) out.N.push({a,soFar:true}); return; }
    const k=r.status==="Approved"?({Present:"P",Late:"L",Absent:"A",Excused:"E"}[r.mark]||"P"):r.status==="Declined"?"X":"Q"; out[k].push({a,r}); });
  return {studs, ...out};
}
function missedThisMonth(month){
  const today=sgt().date, studs=S.accounts.filter(a=>a.role==="Student"&&a.active), tt=ttNow();
  const [y,m]=month.split("-").map(Number), dim=new Date(Date.UTC(y,m,0)).getUTCDate(), days=[];
  for (let d=1; d<=dim; d++){ const ds=`${month}-${String(d).padStart(2,"0")}`; if (ds<today && isClassDayC(ds,tt)) days.push(ds); }
  return studs.map(a=>{ let miss=0, late=0; const dates=[]; days.forEach(d=>{ const r=S.records.find(x=>x.date===d&&x.studentKey===a.key); if (!r || r.status==="Declined" || (r.status==="Approved"&&r.mark==="Absent")){ miss++; dates.push(d); } else if (r.status==="Approved"&&r.mark==="Late") late++; }); return {a,miss,late,dates,of:days.length}; })
    .filter(x=>x.miss>0).sort((x,y)=>y.miss-x.miss||y.late-x.late);

    else if (one){

    } else if (ds<=today){

      kind=ds<today&&miss?(miss/tot>0.2?"k-bad":"k-warn"):"k-ok";
      body=`<span class="cal-n">${came}/${st.studs.length}</span><span class="cal-bar"><i style="width:${Math.round(came/tot*100)}%"></i></span>${ds<today&&miss?`<span class="cal-s">${miss} missing</span>`:""}`;
    } else body=`<span class="cal-s">Class</span>`;
    cells.push(`<button type="button" class="cal-c ${kind} ${ds===today?"today":""} ${ds===S.calDay?"sel":""}" data-act="cal-day" data-id="${ds}"><span class="cal-d">${d}</span>${modLbl}${body}</button>`);
  }
  const prev=new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,7), next=new Date(Date.UTC(y,m,1)).toISOString().slice(0,7);
  const missed=missedThisMonth(month);

function dayPanel(ds){
  const tt=ttNow(), cls=isClassDayC(ds,tt), today=sgt().date, ov=(tt.overrides||{})[ds];
  const recorded=!!(tt.recDates||{})[ds], canToggle=S.me.role==="Admin" && ds>=today && !(cls&&recorded);
  const toggle=canToggle?`<button class="btn small" type="button" data-act="toggle-day" data-id="${ds}">${cls?"Mark as no class":"Mark as class day"}</button>${ov?` <span class="hint">Changed from the usual timetable</span>`:""}`
    :ds<today?`<span class="hint">Past days are locked. They always show what was really recorded.</span>`:recorded?`<span class="hint">This day has attendance records, so it stays a class day.</span>`:"";
  const di=dayInfoC(ds);
  const head=`<div class="panel-h" style="margin:0"><div><div class="label">${ds===today?"Today":ds<today?"Past day":"Upcoming"}</div><h2>${dateLabel(ds,{weekday:"long",day:"numeric",month:"long"})}</h2>${cls&&di.moduleName?`<p class="muted" style="margin-top:4px">${esc(di.moduleName)} · ${esc(timeRange(di.classStart,di.classEnd))}${di.lecturerName?` · ${esc(di.lecturerName)}`:""}</p>`:""}</div></div>`;
  if (!cls) return head+`<p class="muted">${ds<today?"No attendance was recorded on this day, so it is not counted.":tt.start&&ds<tt.start?"Before the start date. Not counted.":tt.end&&ds>tt.end?"After the end date. Not counted.":"No class on this day. Students can't submit and nothing is counted."}</p><div>${toggle}</div>`;
  if (ds>today) return head+`<p class="muted">Class day. Attendance opens on the day.</p><div>${toggle}</div>`;
  const st=dayStats(ds);
  const grp=(title,arr,cls2,showTime)=>arr.length?`<div><div class="label" style="margin-bottom:4px">${title} (${arr.length})</div><div class="namegrid">${arr.map(x=>`<span class="nm ${cls2}">${esc(x.a.displayName)}${showTime&&x.r?` <span class="mono faint">${fmt12(x.r.submittedTime)}</span>`:""}${x.r&&msgsOf(x.r).length?` <button type="button" class="linkbtn" data-act="open-thread" data-id="${esc(x.r.id)}">message</button>`:""}</span>`).join("")}</div></div>`:"";
  return head+`<div class="stats" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="stat s-present"><b>${st.P.length}</b><span>Present</span></div><div class="stat s-late"><b>${st.L.length}</b><span>Late</span></div><div class="stat s-pending"><b>${st.Q.length}</b><span>Pending</span></div><div class="stat s-declined"><b>${st.N.length+st.A.length+st.X.length}</b><span>${ds===today?"Not yet / absent":"Missing"}</span></div></div>
    ${grp(ds===today?"Not submitted yet":"Did not submit",st.N,"miss",false)}${grp("Absent",st.A,"miss",false)}${grp("Excused (MC)",st.E,"",false)}${grp("Declined",st.X,"miss",true)}${grp("Late",st.L,"late",true)}${grp("Pending",st.Q,"",true)}${grp("Present",st.P,"ok",true)}
    <div>${toggle}</div>`;
}

function readFileForUpload(file){
  return new Promise((resolve,reject)=>{
    if (!file) return resolve(null);
    if (file.type==="application/pdf"){
      if (file.size>5*1024*1024) return reject(new Error("The PDF is too big (max 5 MB)."));
      const fr=new FileReader(); fr.onload=()=>resolve({mime:"application/pdf", data:String(fr.result).split(",")[1], label:file.name, preview:""}); fr.onerror=()=>reject(new Error("Couldn't read the file.")); fr.readAsDataURL(file); return;
    }
    if (!/^image\//.test(file.type)) return reject(new Error("Choose a photo or a PDF."));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const max=1600, k=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); const du=c.toDataURL("image/jpeg",0.8);
      resolve({mime:"image/jpeg", data:du.split(",")[1], label:file.name+" ("+Math.round(du.length*0.75/1024)+" KB)", preview:du}); };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("Couldn't open that photo. Try a JPG or PNG.")); };
    img.src=url;
  });
}

async function viewMc(id){

function studentToday(){

  const greet=now.h<12?"Good morning":now.h<18?"Good afternoon":"Good evening";
  let form;
  const tt=ttNow(), classToday=isClassDayC(now.date,tt), nxt=nextClassDay(now.date,tt);

  else form=`<form class="stack" id="att-form">
      <div class="fields"><label class="field"><span>Student</span><input class="input" value="${esc(S.me.displayName)}" readonly></label><label class="field"><span>Month</span><input class="input" value="${esc(monthLabel(now.month))}" readonly></label></div>
      ${info.moduleId?`<label class="field"><span>Module (from the timetable)</span><input class="input" value="${esc(info.moduleName)} · ${esc(timeRange(info.classStart,info.classEnd))}" readonly><input type="hidden" id="f-module" value="${esc(info.moduleId)}"></label>`
        :`<label class="field"><span>Module name</span><select class="input" id="f-module">${mods.map(m=>`<option value="${esc(m.id)}" ${m.id===S.todayModule?"selected":""}>${esc(m.name)}</option>`).join("")}</select></label>`}
      <div class="fields"><label class="field"><span>Date</span><input class="input" value="${esc(dateLabel(now.date))}" readonly></label><label class="field"><span>Time (recorded on submit)</span><input class="input mono" readonly data-clockinput></label></div>

function lockChip(a){
  if (a.blocked) return chip("Declined","Locked");
  if (a.waitSec>0) return chip("Late","Waiting "+Math.ceil(a.waitSec/60)+" min");
  if (a.failCount>0) return `<span class="faint" style="font-size:.8rem">${a.failCount} wrong</span>`;
  return "";
}
function studentsView(){
  const today=sgt().date, month=sgt().month, q=S.stuQ.trim().toLowerCase();
  const all=S.accounts.filter(a=>a.role==="Student"&&a.active);
  const list=all.filter(a=>!q||`${a.displayName} ${a.studentId} ${a.username}`.toLowerCase().includes(q));
  const todayRec=k=>S.records.filter(r=>r.date===today&&r.studentKey===k);
  const t={p:0,l:0,pend:0,none:0};
  all.forEach(a=>{ const rs=todayRec(a.key); if (!rs.length) t.none++; else rs.forEach(r=>{ if (r.status==="Pending") t.pend++; else if (r.status==="Approved"&&r.mark==="Late") t.l++; else if (r.status==="Approved"&&r.mark==="Present") t.p++; }); });
  const todayChip=a=>{ const rs=todayRec(a.key); if (!rs.length) return `<span class="faint">${isClassDayC(today)?"Not yet":"No class"}</span>`; const r=rs[0]; return r.status==="Approved"?chip(r.mark):r.status==="Declined"?chip("Declined"):chip("Pending"); };
  const mcount=(a,f)=>S.records.filter(r=>r.month===month&&r.studentKey===a.key&&f(r)).length;
  return `<div class="stack"><div class="panel-h"><div><div class="label">Class list · ${dateLabel(today,{weekday:"long",day:"numeric",month:"long"})}</div><h1>Students <span class="faint">(${all.length})</span></h1></div>

    <div class="rows"><div class="srow head stu"><span>#</span><span>Student</span><span>Today</span><span>${esc(monthLabel(month).split(" ")[0].slice(0,3))} P / L / A</span><span></span></div>

      <div class="who"><b title="${esc(a.displayName)}">${esc(a.displayName)}</b><span class="mono">${esc(a.studentId||a.username)}</span></div>

async function saveAdminSettings(){
  const f=$("#st-form");
  await run("apiSaveSettings",[S.token,{schoolName:$("#st-school").value.trim(), classStart:$("#st-start").value, presentUntil:$("#st-until").value, openAt:$("#st-open").value, closeAt:$("#st-close").value, formUrl:f?f.value.trim():undefined}],"Settings saved.");
}

/* ---------- clock ---------- */
let lastDate=sgt().date;
function tick(){
  const t=sgt(), clock=fmt12(t.time,true), today=dateLabel(t.date,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  document.querySelectorAll("[data-clock]").forEach(e=>e.textContent=clock);
  document.querySelectorAll("[data-today]").forEach(e=>e.textContent=today+" · SGT");
  document.querySelectorAll("[data-clockinput]").forEach(e=>e.value=clock);
  if (S.me && S.me.role==="Student" && S.tab==="today"){ const ws=windowState(t.time); if (S.lastWs && S.lastWs!==ws){ S.lastWs=ws; refresh(true); return; } S.lastWs=ws; }
  const cl=$("[data-closes]"); if (cl){ const left=toSecs(closeAt()+":00")+59-toSecs(t.time); cl.textContent=left>0&&left<=1800?`Closes in ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")} (${fmt12(closeAt()+":00")}).`:`Open until ${fmt12(closeAt()+":00")}.`; }
  const p=$("[data-predict]"); if (p){ const m=autoMarkFor(t.time,{presentUntil:untilAt()}); p.innerHTML=`${chip(m)} <span>If you submit now you'll be recorded as <b>${m}</b>. Your lecturer confirms it.</span>`;
    const mb=$("[data-msgbox]"), ml=$("[data-msglabel]");
    if (mb){ const late=m==="Late"; if (mb.classList.contains("late")!==late){ mb.classList.toggle("late",late); if (ml) ml.textContent= late?`You're late. Tell ${lecturerOfModule(S.todayModule)} why (they can change it to Present)`:`Message to ${lecturerOfModule(S.todayModule)} (optional)`; } } }
  if (S.loginLock && !S.loginLock.blocked && !S.me){
    const sec=Math.max(0,Math.ceil((S.loginLock.until-Date.now())/1000)), c=$("[data-lockcount]");
    if (!sec){ S.loginLock=null; render(); return; }
    if (c) c.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
  }
  const n=$("[data-tlnow]"); if (n){ const from=+n.dataset.from, span=+n.dataset.span, mins=t.h*60+t.m+t.s/60; n.style.left=Math.max(0,Math.min(100,(mins-from)/span*100))+"%"; }
  if (t.date!==lastDate){ lastDate=t.date; if (S.me) render(); }
}

/* ---------- events ---------- */
document.addEventListener("submit", e=>{ e.preventDefault(); ({"login-form":doLogin,"att-form":submitAttendance,"pw-form":changePassword,"set-form":saveAdminSettings,"tt-form":saveTimetable,"leave-form":submitLeave}[e.target.id]||(()=>{}))(); });
document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if (!b) return;
  const id=b.dataset.id;
  switch(b.dataset.act){
    case "tab": S.tab=id; setMenu(false); render(); window.scrollTo({top:0}); if (id==="system") checkServer(); break;
    case "menu": setMenu(true); render(); { const f=document.querySelector('.d-item[aria-current="page"]')||document.querySelector(".drawer-x"); if (f) f.focus(); } break;
    case "menu-close": setMenu(false); render(); { const m=document.querySelector(".menu-btn"); if (m) m.focus(); } break;
    case "logout": setMenu(false); logout(); break;
    case "approve": review(id,"Approved",b); break;
    case "decline": review(id,"Declined",b); break;
    case "open-rec": openRecord(id); break;
    case "open-thread": openThread(id); break;
    case "add-block": openBlock(null); break;
    case "edit-block": openBlock(id); break;
    case "save-block": saveBlock(id); break;
    case "del-block": deleteBlock(id); break;
    case "tt-month": S.ttMonth=id; render(); break;
    case "view-mc": viewMc(id); break;
    case "accept-mc": reviewMc(id,"Accepted",b); break;
    case "reject-mc": reviewMc(id,"Rejected",b); break;
    case "tab-leave": closeModal(); S.tab="leave"; render(); break;
    case "send-msg": sendMsg(id,b); break;
    case "quick-reason": { const ta=$("#f-note"); if (ta){ ta.value=(ta.value.trim()?ta.value.trim()+" ":"")+id+". "; S.drafts.studentNote=ta.value; ta.focus(); } break; }
    case "cal-day": S.calDay=id; render(); break;
    case "cal-month": S.calMonth=id; S.calDay=id+"-01"; render(); break;
    case "cal-pick": S.calStudent=id; render(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "toggle-day": toggleDay(id); break;
    case "clear-ov": clearOverride(id); break;
    case "save-rec": saveRecord(id); break;
    case "del-rec": deleteRecord(id); break;
    case "add-record": openAddRecord(); break;
    case "save-add": saveAddRecord(); break;
    case "export": openExport(); break;
    case "export-go": exportCsv(); break;
    case "export-sheet": exportSheet(b); break;
    case "add-person": openPerson(null); break;
    case "edit-person": openPerson(id); break;
    case "save-person": savePerson(id); break;
    case "add-module": openModule(null); break;
    case "edit-module": openModule(id); break;
    case "save-module": saveModule(id); break;
    case "connect": connect(); break;
    case "forgot": openForgot(); break;
    case "send-forgot": sendForgot(b); break;
    case "reset-pw": openResetPw(id); break;
    case "do-reset-pw": doResetPw(id); break;
    case "dismiss-req": if (await askConfirm("Dismiss this request?","The student's password stays the same. Use this for duplicate or mistaken requests.","Dismiss")) run("apiDismissRequest",[S.token,id],"Request dismissed."); break;
    case "import-students": openImport(); break;
    case "do-import": doImport(); break;
    case "disconnect": disconnect(); break;
    case "recheck": checkServer(); break;
    case "reset-demo": if (await askConfirm("Reset demo data?","Deletes every demo record and puts back the three starting accounts. This only affects this browser.","Reset",true)){ Local.reset(); endSession(""); toast("Demo data reset.","ok"); } break;
    case "copy": { const el=document.getElementById(id); try { await navigator.clipboard.writeText(el.value); toast("Copied.","ok"); } catch(err){ el.focus(); el.select(); toast("Text selected. Use Copy from your keyboard or menu."); } break; }
    case "close-modal": closeModal(); break;
    case "confirm-yes": { const r=S.confirmRes; S.confirmRes=null; closeModal(); r&&r(true); break; }
    case "confirm-no": closeModal(); break;
  }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if (el.id==="perm-admin") run("apiSetAdminPermission",[S.token,el.checked], el.checked?"Admin can now approve.":"Admin approval turned off.");
  if (el.id==="f-module"){ S.todayModule=el.value; render(); }
  if (el.dataset.calstu!==undefined){ S.calStudent=el.value; render(); }
  if (el.id==="lv-from"){ S.drafts.lvFrom=el.value; if (!$("#lv-to").value || $("#lv-to").value<el.value){ S.drafts.lvTo=el.value; $("#lv-to").value=el.value; } }
  if (el.id==="lv-to") S.drafts.lvTo=el.value;
  if (el.id==="lv-file"){ const f=el.files&&el.files[0]; readFileForUpload(f).then(r=>{ S.lvFile=r; render(); }).catch(e=>{ S.lvFile=null; toast(e.message,"bad"); render(); }); }
  if (el.dataset.in==="histMonth"){ S.histMonth=el.value; render(); }
  if (el.dataset.filter && el.tagName==="SELECT"){ S.filters[el.dataset.filter]=el.value; render(); }
  if (el.dataset.draft && el.type==="radio"){ (S.drafts[el.dataset.draft] ||= {}).mark=el.value; render(); }
});
document.addEventListener("input", e=>{
  const el=e.target;
  if (el.dataset.filter==="q"){ S.filters.q=el.value; render(); }
  if (el.dataset.stuq!==undefined){ S.stuQ=el.value; render(); }
  if (el.dataset.draftnote){ (S.drafts[el.dataset.draftnote] ||= {}).note=el.value; }
  if (el.id==="f-note") S.drafts.studentNote=el.value;
  if (el.id==="lv-msg") S.drafts.lvMsg=el.value;
  if (el.dataset.lvr) S.drafts["lvr:"+el.dataset.lvr]=el.value;
  if (el.id && el.id.startsWith("msg-")) S.drafts["msg:"+el.id.slice(4)]=el.value;
});
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && !$("#modal").hidden) closeModal(); else if (e.key==="Escape" && S.menuOpen){ setMenu(false); render(); } });
/** Use the Menu button whenever the tab bar would need sideways scrolling (any screen size). */
function fitTabs(){
  const top=document.querySelector(".top"), t=top&&top.querySelector(".tabs"); if (!t) return;
  top.classList.remove("use-menu");
  if (getComputedStyle(t).display==="none") return;          // phones: Menu already
  if (t.scrollWidth > t.clientWidth+1) top.classList.add("use-menu");
}
function setMenu(open){ S.menuAnim=!!open && !S.menuOpen; S.menuOpen=!!open; document.body.classList.toggle("noscroll", !!open); if (S.menuAnim) setTimeout(()=>{ S.menuAnim=false; }, 250); }
window.addEventListener("resize", ()=>{ fitTabs(); const top=document.querySelector(".top"); if (S.menuOpen && top && !top.classList.contains("use-menu") && window.innerWidth>760){ setMenu(false); render(); } });

boot();
